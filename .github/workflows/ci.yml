name: CI

on:
  push:
    branches: ["main", "development", "production-p0-launch-foundation"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit tracked source files
        run: npm run source:audit

      - name: Reset sample catalog
        run: npm run db:bootstrap

      - name: Typecheck, test, and production build
        run: npm run verify
